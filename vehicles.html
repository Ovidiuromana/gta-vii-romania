<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101827">
<title>GTA VII România — Traffic & Police Prototype</title><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}#scene{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none}.panel{position:absolute;top:12px;right:12px;background:#07101bd9;border:1px solid #ffffff35;border-radius:12px;padding:10px 13px;text-align:right}.label{font-size:10px;color:#cbd5e1;font-weight:800;letter-spacing:.08em}.stars{font-size:22px;letter-spacing:2px;color:#536174;text-shadow:0 2px #000}.stars .on{color:#ffd447;text-shadow:0 0 10px #ffd447}.speed{font-size:22px;color:#4ade80;font-weight:950}.toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:#07101bd9;border:1px solid #ffd447;border-radius:20px;padding:8px 14px;font-size:12px;font-weight:850;opacity:0;transition:opacity .2s;white-space:nowrap}.help{position:absolute;left:12px;top:12px;padding:8px 10px;background:#07101bd9;border-radius:10px;color:#dbe4ef;font-size:11px;line-height:1.45}.touch{position:absolute;bottom:max(15px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.touchgroup{display:flex;gap:8px;pointer-events:auto}.touch button{border:1px solid #ffffff66;border-radius:14px;background:#07101bdd;color:#fff;font-weight:900;padding:14px 16px;min-width:60px;min-height:56px;touch-action:none}.touch button:active,.touch button.active{background:#ffd44766}.touch .gas{border-color:#4ade80;color:#86efac}.touch .brake{border-color:#f87171;color:#fecaca}.touch .horn{border-color:#38bdf8;color:#7dd3fc}#error{position:fixed;inset:0;display:none;place-items:center;padding:24px;background:#101827;text-align:center}
</style></head>
<body><div id="scene"></div><section id="hud"><div class="help"><b>CONDUCERE</b><br>WASD / săgeți · Space claxon · Shift frână de mână<br>Mobile: butoane de condus</div><div class="panel"><div class="label">NIVEL DE URMĂRIRE</div><div class="stars" id="stars">★★★★★</div><div class="speed"><span id="speed">0</span> <small>KM/H</small></div></div><div class="toast" id="toast"></div><div class="touch"><div class="touchgroup"><button class="brake" id="left">◀</button><button class="brake" id="right">▶</button></div><div class="touchgroup"><button class="horn" id="horn">📣</button><button class="brake" id="reverse">▼</button><button class="gas" id="gas">▲ GAZ</button></div></div></section><div id="error"><div><h2>WebGL indisponibil</h2><p>Încearcă un browser modern cu accelerare hardware activată.</p></div></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);if(!window.THREE){$('error').style.display='grid';return;}let renderer,scene,camera;try{renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;$('scene').appendChild(renderer.domElement);}catch(e){$('error').style.display='grid';return;}
scene=new THREE.Scene();scene.background=new THREE.Color(0x9caeb6);scene.fog=new THREE.Fog(0x9caeb6,180,520);camera=new THREE.PerspectiveCamera(64,innerWidth/innerHeight,.1,650);scene.add(new THREE.HemisphereLight(0xe4f3ff,0x35402f,1.15));const sun=new THREE.DirectionalLight(0xffe6c6,1.25);sun.position.set(-80,140,80);sun.castShadow=true;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(900,900),new THREE.MeshStandardMaterial({color:0x63765b,roughness:.95}));ground.rotation.x=-Math.PI/2;ground.position.y=-.12;scene.add(ground);
const roads=[-240,-120,0,120,240],cars=[],police=[],keys={},input={gas:false,brake:false,left:false,right:false};let wanted=0,wantedTimer=0,tick=0,radarCd=0,audio=null,lastCollision=0,toastTimer;
function mat(color,roughness=.65,emissive=0){return new THREE.MeshStandardMaterial({color,roughness,metalness:.18,emissive,emissiveIntensity:emissive?1:0});}
const asphalt=mat(0x242a30,.95),mark=new THREE.MeshBasicMaterial({color:0xe9e5d7});roads.forEach(r=>{let a=new THREE.Mesh(new THREE.PlaneGeometry(720,28),asphalt);a.rotation.x=-Math.PI/2;a.position.set(0,.01,r);scene.add(a);let b=new THREE.Mesh(new THREE.PlaneGeometry(28,720),asphalt);b.rotation.x=-Math.PI/2;b.position.set(r,.012,0);scene.add(b);for(let n=-350;n<350;n+=22){let l=new THREE.Mesh(new THREE.PlaneGeometry(8,.3),mark);l.rotation.x=-Math.PI/2;l.position.set(n,.03,r);scene.add(l);let l2=new THREE.Mesh(new THREE.PlaneGeometry(.3,8),mark);l2.rotation.x=-Math.PI/2;l2.position.set(r,.03,n);scene.add(l2);}});
// Roundabout island and Romanian tricolor flag.
const island=new THREE.Mesh(new THREE.CylinderGeometry(11,12,.8,32),mat(0x238349));island.position.y=.35;scene.add(island);const pole=new THREE.Mesh(new THREE.CylinderGeometry(.18,.22,14,10),mat(0xe2e8f0));pole.position.y=7;scene.add(pole);[0x002b7f,0xfcd116,0xce1126].forEach((c,i)=>{const f=new THREE.Mesh(new THREE.BoxGeometry(1.7,2.4,.15),new THREE.MeshBasicMaterial({color:c}));f.position.set(1+i*1.7,11,0);scene.add(f);});
// Simple apartment blocks with emissive window grids.
for(let x=-300;x<=300;x+=120)for(let z=-300;z<=300;z+=120){if(x===-60&&z===-60)continue;const h=28+((Math.abs(x*7+z*13)%4)*7),b=new THREE.Mesh(new THREE.BoxGeometry(28,h,28),mat([0x8c8580,0x777e84,0x9d8d79][Math.abs(x+z)%3]));b.position.set(x,h/2,z);b.castShadow=true;scene.add(b);for(let y=5;y<h-2;y+=6)for(let xx=-8;xx<=8;xx+=8){const w=new THREE.Mesh(new THREE.PlaneGeometry(3,2),new THREE.MeshStandardMaterial({color:0xf9d889,emissive:0x6a4b15,emissiveIntensity:.3}));w.position.set(x+xx,y,z+14.02);scene.add(w);}}
function makeCar(x,z,yaw,color,type='traffic',name='Dacia clasică'){const group=new THREE.Group(),body=new THREE.Mesh(new THREE.BoxGeometry(2.6,.95,5.25),mat(color,.32));body.position.y=.87;body.castShadow=true;group.add(body);const cabin=new THREE.Mesh(new THREE.BoxGeometry(2.08,.82,2.65),mat(0x18232c,.22));cabin.position.set(0,1.52,-.2);group.add(cabin);const wheelGeo=new THREE.CylinderGeometry(.43,.43,.32,12);wheelGeo.rotateZ(Math.PI/2);for(const xx of [-1.32,1.32])for(const zz of [-1.63,1.63]){const w=new THREE.Mesh(wheelGeo,mat(0x101318,.92));w.position.set(xx,.43,zz);group.add(w);}const headMat=new THREE.MeshBasicMaterial({color:0xfff0b5}),tailMat=new THREE.MeshBasicMaterial({color:0x340b0b});let headlights=[],taillights=[];for(const xx of [-.86,.86]){const h=new THREE.Mesh(new THREE.BoxGeometry(.52,.22,.07),headMat);h.position.set(xx,.9,2.66);group.add(h);headlights.push(h);const t=new THREE.Mesh(new THREE.BoxGeometry(.52,.22,.07),tailMat);t.position.set(xx,.9,-2.66);group.add(t);taillights.push(t);}group.position.set(x,0,z);group.rotation.y=yaw;scene.add(group);const car={mesh:group,x,z,yaw,speed:0,type,name,health:100,headlights,taillights,sirenRed:null,sirenBlue:null};if(type==='police'){const r=new THREE.Mesh(new THREE.BoxGeometry(.65,.24,.28),new THREE.MeshBasicMaterial({color:0xff2020})),b=new THREE.Mesh(new THREE.BoxGeometry(.65,.24,.28),new THREE.MeshBasicMaterial({color:0x225dff}));r.position.set(-.42,2.08,-.2);b.position.set(.42,2.08,-.2);group.add(r,b);car.sirenRed=r;car.sirenBlue=b;}cars.push(car);if(type==='police')police.push(car);return car;}
const player=makeCar(-25,-22,0,0x080a0e,'player','Sport sedan');
for(let i=0;i<16;i++){const horiz=i%3!==0,road=roads[(i*3)%roads.length],dir=i%2?1:-1;const x=horiz?-310+i*43:road+dir*6,z=horiz?road+dir*6:-310+i*43,yaw=horiz?(dir>0?Math.PI/2:-Math.PI/2):(dir>0?0:Math.PI);makeCar(x,z,yaw,[0xf4f3ed,0xe6e1d3,0xd1d5db,0xb7b8b2][i%4],'traffic','Dacia clasică');}
function unlockAudio(){try{if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC();}if(audio?.state==='suspended')audio.resume();}catch(e){}}
function tone(freq,duration=.16,wave='sawtooth',volume=.04,endFreq=freq){if(!audio||audio.state!=='running')return;try{const osc=audio.createOscillator(),gain=audio.createGain(),now=audio.currentTime;osc.type=wave;osc.frequency.setValueAtTime(freq,now);osc.frequency.exponentialRampToValueAtTime(Math.max(1,endFreq),now+duration);gain.gain.setValueAtTime(volume,now);gain.gain.exponentialRampToValueAtTime(.001,now+duration);osc.connect(gain);gain.connect(audio.destination);osc.start(now);osc.stop(now+duration+.02);}catch(e){}}
function horn(){unlockAudio();tone(390,.32,'square',.065,320);setTimeout(()=>tone(490,.3,'square',.05,420),55);}function toast(text){const e=$('toast');e.textContent=text;e.style.opacity='1';clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.style.opacity='0',2200);}
function setWanted(reason){wanted=Math.min(5,wanted+1);wantedTimer=900;renderStars();syncPolice();toast(`🚨 Poliția Română: ${reason} · ${wanted}★`);}
function renderStars(){$('stars').innerHTML=Array.from({length:5},(_,i)=>`<span class="${i<wanted?'on':''}">★</span>`).join('');}
function syncPolice(){while(police.length<wanted){const angle=Math.random()*Math.PI*2,d=75+Math.random()*25;makeCar(player.x+Math.cos(angle)*d,player.z+Math.sin(angle)*d,Math.atan2(player.x-(player.x+Math.cos(angle)*d),player.z-(player.z+Math.sin(angle)*d)),0xf2f4f4,'police','Poliția Română');}while(police.length>wanted){const p=police.pop();scene.remove(p.mesh);const i=cars.indexOf(p);if(i>=0)cars.splice(i,1);}}
function crash(){const now=performance.now();if(now-lastCollision<1300)return;lastCollision=now;player.health=Math.max(0,player.health-8);player.speed*=-.28;tone(95,.22,'sawtooth',.07,42);setWanted('coliziune cu trafic');}
function animate(){requestAnimationFrame(animate);tick++;const dt=1/60;const forward=keys.w||keys.arrowup||input.gas,back=keys.s||keys.arrowdown||input.brake,left=keys.a||keys.arrowleft||input.left,right=keys.d||keys.arrowright||input.right,drift=keys.shift;
 if(forward){player.speed=Math.min(1.65,player.speed+.027);if(tick%10===0)tone(65+Math.abs(player.speed)*38,.08,'sawtooth',.012,90+Math.abs(player.speed)*55);}else if(back){if(player.speed>.08)player.speed*=.9;else player.speed=Math.max(-.55,player.speed-.018);}else player.speed*=.986;
 const turn=(right?1:0)-(left?1:0);if(Math.abs(player.speed)>.025)player.yaw-=turn*.045*Math.sign(player.speed)*(drift?1.8:1);
 const nx=player.x+Math.sin(player.yaw)*player.speed,nz=player.z+Math.cos(player.yaw)*player.speed;if(Math.abs(nx)<350&&Math.abs(nz)<350){player.x=nx;player.z=nz;}else player.speed*=-.3;player.mesh.position.set(player.x,0,player.z);player.mesh.rotation.y=player.yaw;
 const kmh=Math.round(Math.abs(player.speed)*112);$('speed').textContent=kmh;if(kmh>125&&radarCd<=0){setWanted('viteză excesivă detectată');radarCd=300;}radarCd=Math.max(0,radarCd-1);
 for(const c of cars){if(c===player)continue;if(c.type==='traffic'){c.x+=Math.sin(c.yaw)*.21;c.z+=Math.cos(c.yaw)*.21;if(Math.abs(c.x)>345)c.x=-Math.sign(c.x)*330;if(Math.abs(c.z)>345)c.z=-Math.sign(c.z)*330;c.mesh.position.set(c.x,0,c.z);if(Math.hypot(player.x-c.x,player.z-c.z)<3.9&&Math.abs(player.speed)>.25)crash();}
 else if(c.type==='police'){const desired=Math.atan2(player.x-c.x,player.z-c.z);let diff=desired-c.yaw;while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;c.yaw+=diff*.055;const chase=.45+wanted*.075,px=c.x+Math.sin(c.yaw)*chase,pz=c.z+Math.cos(c.yaw)*chase;c.x=px;c.z=pz;c.mesh.position.set(px,0,pz);c.mesh.rotation.y=c.yaw;const blink=(tick>>3)%2===0;c.sirenRed.material.color.setHex(blink?0xff2020:0x420606);c.sirenBlue.material.color.setHex(blink?0x071c58:0x2868ff);if(Math.hypot(player.x-c.x,player.z-c.z)<4.2){player.health=Math.max(0,player.health-.04);player.speed*=.985;}}
 }
 if(wanted>0){wantedTimer--;if(wantedTimer<=0){wanted--;wantedTimer=700;syncPolice();renderStars();if(wanted===0)toast('Ai scăpat de poliție!');}}
 const night=0;void night;
 const target=new THREE.Vector3(player.x-Math.sin(player.yaw)*13,7,player.z-Math.cos(player.yaw)*13);camera.position.lerp(target,.12);camera.lookAt(player.x,1.2,player.z);if(drift&&Math.abs(player.speed)>.4)camera.fov=THREE.MathUtils.lerp(camera.fov,74,.08);else camera.fov=THREE.MathUtils.lerp(camera.fov,64,.08);camera.updateProjectionMatrix();renderer.render(scene,camera);
}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();horn();}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);function bind(id,key){const el=$(id);const down=e=>{e.preventDefault();input[key]=true;el.classList.add('active');el.setPointerCapture?.(e.pointerId);};const up=()=>{input[key]=false;el.classList.remove('active');};el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);}bind('gas','gas');bind('reverse','brake');bind('left','left');bind('right','right');$('horn').addEventListener('pointerdown',horn);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});renderStars();animate();
})();
</script></body></html>
