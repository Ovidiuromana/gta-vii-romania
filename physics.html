<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;user-select:none}#scene{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none}.panel{position:absolute;top:12px;right:12px;padding:10px 13px;border:1px solid #ffffff38;border-radius:12px;background:#07101bdc;text-align:right}.speed{color:#4ade80;font-size:26px;font-weight:1000}.sub{color:#cbd5e1;font-size:10px}.damage{color:#fca5a5;font-weight:900;font-size:11px}.road{color:#93c5fd;font-size:10px;font-weight:850}.help{position:absolute;top:12px;left:12px;padding:9px 11px;background:#07101bdc;border-radius:10px;font-size:10px;line-height:1.5;color:#dbe4ef}.toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);padding:8px 13px;border:1px solid #ffd447;border-radius:18px;background:#07101be8;font-size:11px;font-weight:850;opacity:0;transition:opacity .2s}.touch{position:absolute;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;pointer-events:none}.group{display:flex;gap:8px;align-items:end;pointer-events:auto}.touch button{min-width:52px;min-height:54px;padding:10px;border:1px solid #ffffff70;border-radius:14px;background:#07101be8;color:#fff;font-size:11px;font-weight:950;touch-action:none}.touch .gas{min-height:72px;color:#86efac;border-color:#4ade80}.touch .brake{color:#fecaca;border-color:#f87171}.touch .drift{color:#7dd3fc;border-color:#38bdf8}.touch button.active{background:#ffffff35;transform:scale(.96)}#error{position:fixed;inset:0;display:none;place-items:center;padding:24px;color:#fff;background:#101827;text-align:center}

<body><div id="scene"></div><div class="hud"><div class="help"><b>ADVANCED DRIVING TEST</b><br>WASD / arrows · Shift handbrake<br>Asphalt = grip · dirt/grass = low traction<br>Mobile controls below</div><div class="panel"><div class="speed"><span id="speed">0</span> <small>KM/H</small></div><div class="damage" id="damage">BODY 100% · GLASS 100%</div><div class="road" id="surface">ASPHALT</div></div><div class="toast" id="toast"></div><div class="touch"><div class="group"><button id="left">◀ LEFT</button><button id="right">RIGHT ▶</button></div><div class="group"><button id="drift" class="drift">DRIFT</button><button id="brake" class="brake">▼<br>BRAKE</button><button id="gas" class="gas">▲<br>GAS</button></div></div></div><div id="error"><div><h2>WebGL or module loading unavailable</h2><p>Use a modern browser and serve this page over HTTP with internet access.</p></div></div>
<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

const $=id=>document.getElementById(id),root=$('scene');
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;root.appendChild(renderer.domElement);}catch(e){$('error').style.display='grid';throw e;}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9eb5bf);scene.fog=new THREE.Fog(0x9eb5bf,150,430);
const camera=new THREE.PerspectiveCamera(63,innerWidth/innerHeight,.1,700);
scene.add(new THREE.HemisphereLight(0xe4f3ff,0x35402f,1.35));const sun=new THREE.DirectionalLight(0xffe6c6,2.0);sun.position.set(-80,120,70);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const world=new CANNON.World({gravity:new CANNON.Vec3(0,-9.82,0)});world.allowSleep=true;world.broadphase=new CANNON.SAPBroadphase(world);world.solver.iterations=12;
const asphaltMat=new CANNON.Material('asphalt'),groundMat=new CANNON.Material('ground'),vehicleMat=new CANNON.Material('vehicle'),trafficMat=new CANNON.Material('traffic');
world.addContactMaterial(new CANNON.ContactMaterial(vehicleMat,asphaltMat,{friction:.95,restitution:.02}));world.addContactMaterial(new CANNON.ContactMaterial(vehicleMat,groundMat,{friction:.58,restitution:.01}));world.addContactMaterial(new CANNON.ContactMaterial(vehicleMat,trafficMat,{friction:.65,restitution:.08}));
function meshBox(w,h,d,color,x,y,z,material=null){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.82}));mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);if(material){const body=new CANNON.Body({mass:0,material,shape:new CANNON.Box(new CANNON.Vec3(w/2,h/2,d/2)),position:new CANNON.Vec3(x,y,z)});world.addBody(body);return{mesh,body};}return{mesh};}
// Ground and two broad roads. Dirt and grass remain physical surfaces outside asphalt.
const ground=new THREE.Mesh(new THREE.PlaneGeometry(900,900),new THREE.MeshStandardMaterial({color:0x687d5c,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.12;ground.receiveShadow=true;scene.add(ground);
const groundBody=new CANNON.Body({mass:0,material:groundMat,shape:new CANNON.Plane(),position:new CANNON.Vec3(0,-.12,0)});groundBody.quaternion.setFromEuler(-Math.PI/2,0,0);world.addBody(groundBody);
const roadMaterial=new THREE.MeshStandardMaterial({color:0x252b32,roughness:.96});for(const axis of ['x','z']){const road=new THREE.Mesh(new THREE.PlaneGeometry(720,24),roadMaterial);road.rotation.x=-Math.PI/2;if(axis==='x')road.position.set(0,.01,0);else{road.rotation.z=Math.PI/2;road.rotation.x=0;road.position.set(0,.01,0);}scene.add(road);}
// Asphalt collision slabs under the visible cross roads.
for(const [w,d] of [[720,24],[24,720]]){const b=new CANNON.Body({mass:0,material:asphaltMat,shape:new CANNON.Box(new CANNON.Vec3(w/2,.12,d/2)),position:new CANNON.Vec3(0,-.14,0)});world.addBody(b);}
const stripeMat=new THREE.MeshBasicMaterial({color:0xf5ecd1});for(let i=-340;i<350;i+=22){const a=new THREE.Mesh(new THREE.PlaneGeometry(8,.32),stripeMat);a.rotation.x=-Math.PI/2;a.position.set(i,.04,0);scene.add(a);const b=new THREE.Mesh(new THREE.PlaneGeometry(.32,8),stripeMat);b.rotation.x=-Math.PI/2;b.position.set(0,.041,i);scene.add(b);}
// Romanian-inspired low skyline and collision-enabled buildings along both roads.
const blocks=[];for(let x=-270;x<=270;x+=90)for(let z=-270;z<=270;z+=90){if(Math.abs(x)<36||Math.abs(z)<36)continue;const h=22+((Math.abs(x*3+z*7)%4)*7),color=[0x9a8d7b,0x7d8992,0xb7a58d,0x777c83][Math.abs(x+z)%4];const b=meshBox(27,h,27,color,x,h/2,z);b.body.userData={kind:'building'};blocks.push(b);for(let y=5;y<h-2;y+=6)for(let xx=-8;xx<=8;xx+=8){const pane=new THREE.Mesh(new THREE.PlaneGeometry(3,2),new THREE.MeshStandardMaterial({color:0xf4d98a,emissive:0x624b1c,emissiveIntensity:.3}));pane.position.set(x+xx,y,z+13.55);scene.add(pane);}}
// Simple roundabout, island, tricolor landmark.
const island=new THREE.Mesh(new THREE.CylinderGeometry(11,12,.8,32),new THREE.MeshStandardMaterial({color:0x248049}));island.position.y=.35;scene.add(island);const pole=new THREE.Mesh(new THREE.CylinderGeometry(.15,.2,12,8),new THREE.MeshStandardMaterial({color:0xdce3e8}));pole.position.set(0,6.5,0);scene.add(pole);[0x002b7f,0xfcd116,0xce1126].forEach((c,i)=>{const f=new THREE.Mesh(new THREE.BoxGeometry(1.5,2,.12),new THREE.MeshBasicMaterial({color:c}));f.position.set(1+i*1.5,10,0);scene.add(f);});
// Physics chassis and four RaycastVehicle suspension wheels.
const chassisShape=new CANNON.Box(new CANNON.Vec3(1.04,.42,2.15));const chassis=new CANNON.Body({mass:1320,material:vehicleMat,position:new CANNON.Vec3(-19,1.5,-8),linearDamping:.03,angularDamping:.42});chassis.addShape(chassisShape,new CANNON.Vec3(0,-.12,0));chassis.allowSleep=false;world.addBody(chassis);
const vehicle=new CANNON.RaycastVehicle({chassisBody:chassis,indexRightAxis:0,indexUpAxis:1,indexForwardAxis:2});
const wheelOptions={radius:.43,directionLocal:new CANNON.Vec3(0,-1,0),axleLocal:new CANNON.Vec3(-1,0,0),suspensionStiffness:34, suspensionRestLength:.34, frictionSlip:5.2, dampingRelaxation:2.5,dampingCompression:4.6,maxSuspensionForce:100000,rollInfluence:.035,maxSuspensionTravel:.28,customSlidingRotationalSpeed:-30,useCustomSlidingRotationalSpeed:true};
[[-.88,.18,1.42],[.88,.18,1.42],[-.88,.18,-1.42],[.88,.18,-1.42]].forEach((p,i)=>vehicle.addWheel({...wheelOptions, chassisConnectionPointLocal:new CANNON.Vec3(...p),isFrontWheel:i<2}));vehicle.addToWorld(world);
const carVisual=new THREE.Group();scene.add(carVisual);const paint=new THREE.MeshStandardMaterial({color:0x090d13,metalness:.78,roughness:.24});const bodyMesh=new THREE.Mesh(new THREE.BoxGeometry(2.05,.78,4.2),paint);bodyMesh.position.y=.06;bodyMesh.castShadow=true;carVisual.add(bodyMesh);
const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.7,.67,2.05),new THREE.MeshStandardMaterial({color:0x182833,metalness:.2,roughness:.15,transparent:true,opacity:.88}));cabin.position.set(0,.65,-.18);carVisual.add(cabin);
const windshield=new THREE.Mesh(new THREE.PlaneGeometry(1.55,.62),new THREE.MeshStandardMaterial({color:0x75b6d2,metalness:.1,roughness:.15,transparent:true,opacity:.56,side:THREE.DoubleSide}));windshield.position.set(0,.79,1.02);windshield.rotation.x=-.48;carVisual.add(windshield);
const frontBumper=new THREE.Mesh(new THREE.BoxGeometry(2.12,.24,.25),new THREE.MeshStandardMaterial({color:0x11151a,metalness:.48,roughness:.32}));frontBumper.position.set(0,-.28,2.05);frontBumper.name='deformableBumper';carVisual.add(frontBumper);
const lamps=[];for(const x of [-.7,.7]){const lamp=new THREE.Mesh(new THREE.BoxGeometry(.42,.2,.08),new THREE.MeshBasicMaterial({color:0xfff0bd}));lamp.position.set(x,.04,2.13);carVisual.add(lamp);lamps.push(lamp);const tail=new THREE.Mesh(new THREE.BoxGeometry(.42,.18,.08),new THREE.MeshBasicMaterial({color:0x671414}));tail.position.set(x,.05,-2.13);carVisual.add(tail);}
const wheelMeshes=[];for(let i=0;i<4;i++){const tire=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.3,18),new THREE.MeshStandardMaterial({color:0x101318,roughness:.98}));tire.rotation.z=Math.PI/2;scene.add(tire);wheelMeshes.push(tire);const hub=new THREE.Mesh(new THREE.CylinderGeometry(.19,.19,.32,12),new THREE.MeshStandardMaterial({color:0x87919b,metalness:.75,roughness:.3}));hub.rotation.z=Math.PI/2;tire.add(hub);}
// Traffic has dynamic bodies so impacts transmit impulses into the player's chassis.
const traffic=[];function addTraffic(x,z,yaw,color){const body=new CANNON.Body({mass:950,material:trafficMat,position:new CANNON.Vec3(x,.8,z),linearDamping:.35,angularDamping:.65});body.addShape(new CANNON.Box(new CANNON.Vec3(1,.48,1.9)));world.addBody(body);body.userData={kind:'traffic'};const mesh=new THREE.Group();const shell=new THREE.Mesh(new THREE.BoxGeometry(2,.9,3.8),new THREE.MeshStandardMaterial({color,metalness:.18,roughness:.5}));shell.position.y=0;shell.castShadow=true;mesh.add(shell);const windows=new THREE.Mesh(new THREE.BoxGeometry(1.55,.6,1.8),new THREE.MeshStandardMaterial({color:0x30414d,roughness:.2}));windows.position.y=.62;mesh.add(windows);scene.add(mesh);traffic.push({body,mesh,yaw,speed:5+(traffic.length%3)*1.2});}
for(let i=0;i<8;i++){const dir=i%2?1:-1;addTraffic(-115+i*31,dir*5.2,dir>0?Math.PI/2:-Math.PI/2,[0xf1eee4,0xd7d5cc,0xc5cbd0,0x49634c][i%4]);}
// World collision effects: visible bumper deformation, crack lines, sparks and smoke.
const keys={},touch={gas:false,brake:false,left:false,right:false,drift:false};let health=100,glass=100,lastImpact=0,audio=null,toastTimer,particleList=[];const crackGroup=new THREE.Group();carVisual.add(crackGroup);
function toast(text){const e=$('toast');e.textContent=text;e.style.opacity='1';clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.style.opacity='0',2100);}
function unlockAudio(){try{if(!audio){const A=window.AudioContext||window.webkitAudioContext;if(A)audio=new A();}if(audio?.state==='suspended')audio.resume();}catch(e){}}
function impactSound(){unlockAudio();if(!audio)return;try{const osc=audio.createOscillator(),gain=audio.createGain();osc.type='triangle';osc.frequency.setValueAtTime(115,audio.currentTime);osc.frequency.exponentialRampToValueAtTime(35,audio.currentTime+.28);gain.gain.setValueAtTime(.12,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.3);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+.31);}catch(e){}}
function spawnParticles(position,kind='spark'){const color=kind==='spark'?0xffa52f:0x777b7e;for(let i=0;i<(kind==='spark'?16:9);i++){const m=new THREE.Mesh(new THREE.SphereGeometry(kind==='spark'?.055:.12,6,6),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.95}));m.position.copy(position);scene.add(m);particleList.push({mesh:m,life:kind==='spark'?.45:1.5,v:new THREE.Vector3((Math.random()-.5)*(kind==='spark'?7:1.5),Math.random()*(kind==='spark'?6:2),(Math.random()-.5)*(kind==='spark'?7:1.5)),kind});}}
function addCrack(){glass=Math.max(0,glass-13);const origin=new THREE.Vector3((Math.random()-.5)*.8,.82,1.04);for(let i=0;i<5;i++){const angle=i*Math.PI*2/5+Math.random()*.3,len=.27+Math.random()*.34;const points=[origin.clone(),origin.clone().add(new THREE.Vector3(Math.cos(angle)*len,Math.sin(angle)*len*.6,0))];const geo=new THREE.BufferGeometry().setFromPoints(points);const line=new THREE.Line(geo,new THREE.LineBasicMaterial({color:0xc9f2ff,transparent:true,opacity:.9}));crackGroup.add(line);}}
function damage(position,impactSpeed){const now=performance.now();if(now-lastImpact<650||impactSpeed<3.2)return;lastImpact=now;health=Math.max(0,health-Math.min(24,Math.round(impactSpeed*1.3)));frontBumper.scale.x=Math.max(.55,frontBumper.scale.x-.07);frontBumper.position.z-=.035;addCrack();spawnParticles(position,'spark');spawnParticles(position,'smoke');impactSound();toast('Impact! Damage detected — repair at the service point.');}
chassis.addEventListener('collide',event=>{const other=event.body;if(!other.userData?.kind)return;const p=event.contact?.ri?new THREE.Vector3(chassis.position.x,chassis.position.y,chassis.position.z):new THREE.Vector3(chassis.position.x,chassis.position.y,chassis.position.z);damage(p,chassis.velocity.length());});
// Controls + speed-dependent tire friction on asphalt versus dirt/grass.
function bind(id,name){const el=$(id),down=e=>{e.preventDefault();unlockAudio();touch[name]=true;el.classList.add('active');try{el.setPointerCapture(e.pointerId);}catch(_){}};const up=()=>{touch[name]=false;el.classList.remove('active');};el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);}
bind('gas','gas');bind('brake','brake');bind('left','left');bind('right','right');bind('drift','drift');addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let steer=0,previousSpeed=0;const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),1/30);const forward=keys.w||keys.arrowup||touch.gas,back=keys.s||keys.arrowdown||touch.brake,left=keys.a||keys.arrowleft||touch.left,right=keys.d||keys.arrowright||touch.right,handbrake=keys.shift||touch.drift;
  const speed=chassis.velocity.length(),speedKmh=Math.round(speed*3.6);$('speed').textContent=speedKmh;
  // Identify surface beneath the car and adjust suspension tire grip for asphalt vs loose terrain.
  const onAsphalt=Math.abs(chassis.position.x)<13||Math.abs(chassis.position.z)<13;const surface=onAsphalt?'ASPHALT':'DIRT / GRASS';$('surface').textContent=surface;vehicle.wheelInfos.forEach(w=>{w.frictionSlip=onAsphalt?(handbrake?1.15:5.2):(handbrake?.55:1.65);w.suspensionStiffness=onAsphalt?34:27;});
  steer=THREE.MathUtils.damp(steer,(left?1:0)-(right?1:0),5,dt);const maxSteer=.48;vehicle.setSteeringValue(steer*maxSteer,0);vehicle.setSteeringValue(steer*maxSteer,1);
  vehicle.applyEngineForce(forward?-7200:back?3900:0,2);vehicle.applyEngineForce(forward?-7200:back?3900:0,3);
  const brakeForce=handbrake?30:back&&speed>1?12:0;for(let i=0;i<4;i++)vehicle.setBrake(brakeForce,i);
  // Rollover protection limits extreme flips without removing visible body roll.
  chassis.angularVelocity.x*=.997;chassis.angularVelocity.z*=.997;
  world.step(1/60,dt,3);
  carVisual.position.set(chassis.position.x,chassis.position.y-.36,chassis.position.z);carVisual.quaternion.set(chassis.quaternion.x,chassis.quaternion.y,chassis.quaternion.z,chassis.quaternion.w);
  // Extra damped body roll and pitch visualizes load transfer over the suspension response.
  const accel=(speed-previousSpeed)/Math.max(dt,.001);previousSpeed=speed;const targetRoll=THREE.MathUtils.clamp(-steer*speed*.045,-.2,.2),targetPitch=THREE.MathUtils.clamp(accel*.018,-.13,.13);bodyMesh.rotation.z=THREE.MathUtils.damp(bodyMesh.rotation.z,targetRoll,5,dt);bodyMesh.rotation.x=THREE.MathUtils.damp(bodyMesh.rotation.x,-targetPitch,4,dt);cabin.rotation.z=bodyMesh.rotation.z*.65;
  for(let i=0;i<vehicle.wheelInfos.length;i++){vehicle.updateWheelTransform(i);const t=vehicle.wheelInfos[i].worldTransform;wheelMeshes[i].position.set(t.position.x,t.position.y,t.position.z);wheelMeshes[i].quaternion.set(t.quaternion.x,t.quaternion.y,t.quaternion.z,t.quaternion.w);}
  // Simple looped AI traffic follows the cross-city avenue.
  traffic.forEach((car,i)=>{if(Math.abs(car.body.position.x)>355)car.body.position.x=-345;car.body.velocity.x=car.speed*(i%2?1:-1);car.mesh.position.set(car.body.position.x,car.body.position.y,car.body.position.z);car.mesh.quaternion.set(car.body.quaternion.x,car.body.quaternion.y,car.body.quaternion.z,car.body.quaternion.w);});
  particleList=particleList.filter(p=>{p.life-=dt;p.mesh.position.addScaledVector(p.v,dt);p.v.y-=dt*(p.kind==='spark'?8:1);p.mesh.material.opacity=Math.max(0,p.life/(p.kind==='spark'?.45:1.5));if(p.life<=0){scene.remove(p.mesh);p.mesh.geometry.dispose();p.mesh.material.dispose();return false;}return true;});
  const look=new THREE.Vector3(chassis.position.x,1.2,chassis.position.z);const behind=new THREE.Vector3(0,5.3,-10).applyQuaternion(carVisual.quaternion).add(new THREE.Vector3(chassis.position.x,chassis.position.y,chassis.position.z));camera.position.lerp(behind,.11);camera.lookAt(look);camera.fov=THREE.MathUtils.damp(camera.fov,handbrake&&speed>8?72:63,3,dt);camera.updateProjectionMatrix();
  $('damage').textContent='BODY '+health+'% · GLASS '+glass+'%';renderer.render(scene,camera);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
animate();
</script></body></html>
