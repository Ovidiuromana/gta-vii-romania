<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>GTA VII România — Immersion Preview</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}
    #viewport{position:fixed;inset:0;overflow:hidden;background:#111827}
    #gameFrame{position:absolute;inset:-1px;width:calc(100% + 2px);height:calc(100% + 2px);border:0;transform-origin:center;will-change:filter,transform}
    #grade,#streaks,#headlight,#lampGlow,#clock{position:absolute;inset:0;pointer-events:none}
    #grade{z-index:2;background:linear-gradient(180deg,rgba(252,156,84,.05),rgba(17,24,39,.03));mix-blend-mode:soft-light;transition:background 1s linear}
    #headlight{z-index:3;opacity:0;background:radial-gradient(ellipse at 50% 108%,rgba(255,244,198,.34),transparent 42%);transition:opacity .2s}
    #lampGlow{z-index:3;opacity:0;transition:opacity 1s; background:radial-gradient(circle at 8% 30%,rgba(255,214,129,.28),transparent 9%),radial-gradient(circle at 91% 26%,rgba(255,214,129,.25),transparent 9%),radial-gradient(circle at 14% 64%,rgba(255,195,98,.19),transparent 8%),radial-gradient(circle at 87% 68%,rgba(255,195,98,.2),transparent 8%)}
    #streaks{z-index:4;opacity:0;transition:opacity .18s;background:repeating-conic-gradient(from 0deg at 50% 55%,transparent 0deg 5deg,rgba(225,240,255,.16) 5.2deg 5.45deg,transparent 5.7deg 12deg);mask-image:radial-gradient(ellipse at center,transparent 0 29%,#000 85%);-webkit-mask-image:radial-gradient(ellipse at center,transparent 0 29%,#000 85%)}
    #clock{z-index:5;inset:auto 12px 12px auto;width:auto;height:auto;padding:6px 9px;border-radius:8px;background:#08111bb8;border:1px solid #ffffff2b;color:#f8e6ae;font-size:11px;font-weight:800;letter-spacing:.03em}
    #notice{position:absolute;z-index:6;left:50%;top:12px;transform:translateX(-50%);padding:6px 10px;border-radius:8px;background:#07101bd9;border:1px solid #ffffff30;color:#e2e8f0;font-size:10px;font-weight:750;pointer-events:none;white-space:nowrap}
    @media(prefers-reduced-motion:reduce){#gameFrame{will-change:auto}}
  </style>
</head>
<body>
  <main id="viewport" aria-label="Joc 3D cu atmosferă dinamică">
    <iframe id="gameFrame" src="index.html" title="GTA VII România — prototip 3D"></iframe>
    <div id="grade"></div><div id="headlight"></div><div id="lampGlow"></div><div id="streaks"></div>
    <div id="notice">PREVIEW ATMOSFERIC · zi/noapte · efecte de viteză</div><time id="clock"></time>
  </main>
<script>
(() => {
  'use strict';
  const frame=document.getElementById('gameFrame'),grade=document.getElementById('grade'),streaks=document.getElementById('streaks'),headlight=document.getElementById('headlight'),lamps=document.getElementById('lampGlow'),clock=document.getElementById('clock');
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let input=false,car=false,speed=0,shake=0,started=Date.now(),doc=null,canvas=null;
  const held=new Set();
  function getGame(){try{doc=frame.contentDocument;canvas=doc.querySelector('#game canvas');if(!canvas)return;attachControls();}catch(e){}}
  function attachControls(){if(!doc||doc.__immersionBound)return;doc.__immersionBound=true;
    const bind=(id,fn)=>{const el=doc.getElementById(id);if(el){el.addEventListener('pointerdown',fn);el.addEventListener('pointerup',()=>held.delete(id));el.addEventListener('pointercancel',()=>held.delete(id));el.addEventListener('lostpointercapture',()=>held.delete(id));}};
    bind('gas',()=>held.add('gas'));bind('brake',()=>held.add('brake'));bind('action',()=>held.add('action'));
    doc.addEventListener('keydown',e=>{if(['w','arrowup',' '].includes(e.key.toLowerCase()))held.add(e.key.toLowerCase());});
    doc.addEventListener('keyup',e=>held.delete(e.key.toLowerCase()));
    const enter=doc.getElementById('enter');if(enter)enter.addEventListener('click',()=>{car=!car;});
    const originalToast=doc.defaultView&&doc.defaultView.console;
    void originalToast;
  }
  frame.addEventListener('load',getGame);setInterval(getGame,1000);
  function update(){
    const elapsed=(Date.now()-started)/1000;
    // Accelerated cinematic day: 150 seconds per complete in-game day.
    const phase=(elapsed/150*2*Math.PI-Math.PI/2)%(2*Math.PI);
    const daylight=Math.max(0,Math.sin(phase));
    const dusk=Math.max(0,1-Math.abs(Math.sin(phase)));
    const night=1-daylight;
    const warm=Math.max(0,1-Math.abs(Math.sin(phase))*.9);
    const brightness=.62+daylight*.52;
    if(canvas){
      canvas.style.filter=`brightness(${brightness.toFixed(2)}) saturate(${(0.82+daylight*.25).toFixed(2)}) sepia(${(night*.12).toFixed(2)})`;
      if(!reduced){const driving=held.has('gas')||held.has('w')||held.has('arrowup');const braking=held.has('brake')||held.has('s')||held.has('arrowdown');const moving=driving||braking;
        speed=Math.max(0,Math.min(1,speed+(driving?.035:braking?.018:-.025)));
        const impact=held.has('action')?.8:0;shake=Math.max(shake*.86,impact);
        const amount=moving?Math.min(3, speed*2.7):0;
        const jitter=shake?Math.sin(Date.now()*.08)*shake*2:0;
        canvas.style.transform=`translate(${(Math.sin(Date.now()*.035)*amount+jitter).toFixed(2)}px,${(Math.cos(Date.now()*.047)*amount*.65).toFixed(2)}px) scale(${(1+speed*.018).toFixed(3)})`;
        streaks.style.opacity=String(Math.max(0,(speed-.25)*.48));
      }
    }
    grade.style.background=`linear-gradient(180deg,rgba(255,${Math.round(143+daylight*45)},${Math.round(105+daylight*60)},${(.04+dusk*.12).toFixed(3)}),rgba(12,21,42,${(night*.24).toFixed(3)}))`;
    lamps.style.opacity=(night*.88).toFixed(2);
    headlight.style.opacity=(night*(car?.9:.08)).toFixed(2);
    const d=new Date();clock.textContent=`${d.toLocaleDateString('ro-RO')} · ${d.toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit',second:'2-digit'})} · ${night>.62?'NOAPTE':dusk>.55?'APUS':'ZI'}`;
    requestAnimationFrame(update);
  }
  update();
})();
</script>
</body>
</html>
